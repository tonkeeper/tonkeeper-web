    /api/v1/trading/assets/{assetId}/charts:
        get:
            tags: [Assets]
            summary: График цен для ассета
            description: >
                Сервер возвращает график цен для ассета.
            operationId: getAssetCharts
            parameters:
                - $ref: '#/components/parameters/UserAgent'
                - $ref: '#/components/parameters/XLang'
                - $ref: '#/components/parameters/currency'
                - $ref: '#/components/parameters/storeCountyCodeQuery'
                - $ref: '#/components/parameters/simCountryQuery'
                - $ref: '#/components/parameters/deviceCountyCodeQuery'
                - $ref: '#/components/parameters/timezoneQuery'
                - $ref: '#/components/parameters/isVpnActiveQuery'
                - name: start_date
                  in: query
                  required: false
                  schema:
                      type: integer
                      format: int64
                      maximum: 2114380800
                      example: 1668436763
                - name: end_date
                  in: query
                  required: false
                  schema:
                      type: integer
                      format: int64
                      maximum: 2114380800
                      example: 1668436763
                - name: points_count
                  in: query
                  required: false
                  schema:
                      type: integer
                      format: int
                      maximum: 200
                      minimum: 0
                      default: 200
                - name: assetId
                  in: path
                  required: true
                  description:
                      'Уникальный идентификатор ассета (chain-agnostic). Пример:
                      ton/mainnet/jetton/..., eth/mainnet/erc20/...'
                  schema:
                      type: string
                      minLength: 3
                      maxLength: 256
            responses:
                '200':
                    description: Данные для экрана ассета
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ChartPoints'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '500':
                    $ref: '#/components/responses/InternalError'

