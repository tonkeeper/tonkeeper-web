    /api/v1/trading/assets/{assetId}/details:
        get:
            tags: [Assets]
            summary: Детали ассета для экрана ассета
            description: >
                Сервер возвращает секции, которые надо показать на экране, и данные для этих секций.
                Это важно: для разных типов активов секции могут отличаться (например у stocks/RWA
                скрываем overview/activity, оставляем about company). Клиент не должен сам решать,
                что показывать.
            operationId: getAssetDetails
            parameters:
                - $ref: '#/components/parameters/UserAgent'
                - $ref: '#/components/parameters/XLang'
                - $ref: '#/components/parameters/currency'
                - $ref: '#/components/parameters/storeCountyCodeQuery'
                - $ref: '#/components/parameters/simCountryQuery'
                - $ref: '#/components/parameters/deviceCountyCodeQuery'
                - $ref: '#/components/parameters/timezoneQuery'
                - $ref: '#/components/parameters/isVpnActiveQuery'
                - name: assetId
                  in: path
                  required: true
                  description:
                      'Уникальный идентификатор ассета (chain-agnostic). Пример: ton:token:...,
                      eth:token:..., rwa:TSLA.'
                  schema:
                      type: string
                      minLength: 3
                      maxLength: 256
            responses:
                '200':
                    description: Данные для экрана ассета
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AssetDetailsResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '500':
                    $ref: '#/components/responses/InternalError'

