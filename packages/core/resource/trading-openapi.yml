                  schema:
                      type: string
                - name: ids
                  in: query
                  required: false
                  description: Список ассетов, которые нужно получить
                  schema:
                      type: array
                      items:
                          type: string
                          maxItems: 10
                - name: cursor
                  in: query
                  required: false
                  description: Курсор пагинации. Если не задан — первая страница.
