openapi: 3.0.3
info:
    title: Trading UI Backend API
    version: 1.0.0
    description: >
        API для клиента Trading UI. Задача — чтобы клиент был тонкий: структура витрины (полки),
        списки, каталог, детали ассета и trade-config приходят с сервера. Сервер же применяет все
        правила (pin/exclude/лимиты/geo), чтобы не хардкодить это на клиенте.
servers:
    - url: https://api.example.com
      description: Production
    - url: https://staging-api.example.com
      description: Staging

tags:
    - name: Shelves
      description: Конфигурация витрины и полок (порядок, включение, правила, geo).
    - name: Market
      description: Рыночные списки и котировки (то, что показываем в полках и списках).
    - name: Assets
      description: Каталог ассетов и детали ассета.
    - name: Trading
      description: Trade-config и ограничения торговли (пары/действия/роутинг).
    - name: Instruments
      description:
          Опционально. Канонический инструмент + листинги по сетям (когда один RWA в нескольких
          chain).

paths:
    /api/v1/trading/shelves/config:
        get:
            tags: [Shelves]
            summary: Конфиг полок для трейд-вкладки
            description: >
                Клиент дергает при открытии Trade tab (и может периодически обновлять). Сервер
                возвращает список полок в нужном порядке и с правилами, которые сервер же применит
                на выдаче контента полок. Клиент не принимает решения: порядок/лимит/видимость — это
                всё backend. Geo-ограничения применяются здесь же, чтобы клиент не гадал, что
                показывать.
            operationId: getShelvesConfig
            parameters:
                - $ref: '#/components/parameters/UserAgent'
                - $ref: '#/components/parameters/XLang'
                - $ref: '#/components/parameters/currency'
                - $ref: '#/components/parameters/storeCountyCodeQuery'
                - $ref: '#/components/parameters/simCountryQuery'
                - $ref: '#/components/parameters/deviceCountyCodeQuery'
                - $ref: '#/components/parameters/timezoneQuery'
                - $ref: '#/components/parameters/isVpnActiveQuery'
            responses:
                '200':
                    description: Конфиг полок
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ShelvesConfigResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v2/trading/shelves/config:
        get:
            tags: [Shelves]
            summary: Конфиг полок для трейд-вкладки V2
            description: >
                Клиент дергает при открытии Trade tab (и может периодически обновлять). Сервер
                возвращает список полок в нужном порядке и с правилами, которые сервер же применит
                на выдаче контента полок. Клиент не принимает решения: порядок/лимит/видимость — это
                всё backend. Geo-ограничения применяются здесь же, чтобы клиент не гадал, что
                показывать.
            operationId: getShelvesConfigV2
            parameters:
                - $ref: '#/components/parameters/UserAgent'
                - $ref: '#/components/parameters/XLang'
                - $ref: '#/components/parameters/currency'
                - $ref: '#/components/parameters/storeCountyCodeQuery'
                - $ref: '#/components/parameters/simCountryQuery'
                - $ref: '#/components/parameters/deviceCountyCodeQuery'
                - $ref: '#/components/parameters/timezoneQuery'
                - $ref: '#/components/parameters/isVpnActiveQuery'
            responses:
                '200':
                    description: Конфиг полок
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ShelvesConfigResponseV2'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/trading/assets:
        get:
            tags: [Assets]
            summary: Каталог ассетов (infinite scroll) + фильтры
            description: >
                Основной экран "Assets" и результаты поиска. Сервер сортирует и фильтрует. Клиент
                передает tab/type, query, cursor. Сервер возвращает items и next_cursor. Если filter
                недоступен у провайдера, сервер не падает, а возвращает warnings и fallback.
            operationId: getAssetsCatalog
            parameters:
                - $ref: '#/components/parameters/UserAgent'
                - $ref: '#/components/parameters/XLang'
                - $ref: '#/components/parameters/currency'
                - $ref: '#/components/parameters/storeCountyCodeQuery'
                - $ref: '#/components/parameters/simCountryQuery'
                - $ref: '#/components/parameters/deviceCountyCodeQuery'
                - $ref: '#/components/parameters/timezoneQuery'
                - $ref: '#/components/parameters/isVpnActiveQuery'
                - name: tab
                  in: query
                  required: false
                  description: >
                      Таб на экране Assets: all, tokens или perpetuals. stocks/etfs/commodities
                      поддерживаются только для обратной совместимости — вместо них используйте
                      filter.
                  schema:
                      $ref: '#/components/schemas/AssetsTab'
                  example: all
                - name: q
                  in: query
                  required: false
                  description:
                      Поиск по тикеру/имени по префиксу (тикер или имя начинается с запроса).
                      Результаты упорядочены по sort/order (по умолчанию market_cap desc),
                      совпадения с запросом разрешают только ничьи. Каталог (и поиск, и обычный
                      список) возвращает только активы, у которых есть хотя бы один swap-провайдер
                      (is_swappable); для клиентов версии >= 26.09.0 (по User-Agent) провайдер
                      omniston не учитывается. Для tab=perpetuals фильтр не применяется.
                  schema:
                      type: string
                      maxLength: 128
                - name: show_perps
                  in: query
                  required: false
                  description: >
                      Показывать perp-рынки (lighter/...) вместе с остальными активами на любом
                      табе, в том числе в поиске. По умолчанию false — perp-рынки только на
                      tab=perpetuals. Рынки, которые Lighter ещё не листит, каталог не отдаёт (кроме
                      запроса по ids). На tab=perpetuals флаг ничего не меняет. Игнорируется при
                      выбранной сети (chain).
                  schema:
                      type: boolean
                      default: false
                - name: chain
                  in: query
                  required: false
                  description: >
                      Ограничить выдачу одной сетью (ton/eth/...). Если не задано — мультичейн. При
                      выбранной сети perp-рынки (lighter/...) не показываются никогда: ни по
                      show_perps, ни на tab=perpetuals (он вернёт пустой список).
                  schema:
                      type: string
                - name: sort
                  in: query
                  required: false
                  description: Сортировка. По умолчанию volume_24h.
                  schema:
                      $ref: '#/components/schemas/AssetsSort'
                  example: volume_24h
                - name: order
                  in: query
                  required: false
                  description: Порядок сортировки. По умолчанию desc.
                  schema:
                      $ref: '#/components/schemas/AssetsOrder'
                  example: desc
                - name: filter
                  in: query
                  required: false
                  description: >
                      Фильтр по типу актива внутри таба: all (по умолчанию), tokens, stocks, etfs,
                      commodities. Комбинируется с tab и q.
                  schema:
                      $ref: '#/components/schemas/AssetsFilter'
                  example: all
                - name: source_shelf
                  in: query
                  required: false
                  description: >
                      Откуда пришли (для аналитики и корректного fallback). Например most_traded или
                      top_gainers. Не обязателен, но полезен.
                  schema:
                      type: string
                - name: cursor
                  in: query
                  required: false
                  description: Курсор пагинации. Если не задан — первая страница.
                  schema:
                      type: string
                - name: page_size
                  in: query
                  required: false
                  description: >
                      Размер страницы. Сервер может clamp-нуть. Клиенту не надо ставить огромные
                      значения.
                  schema:
                      type: integer
                      minimum: 10
                      maximum: 200
                      default: 50
            responses:
                '200':
                    description: Страница каталога
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AssetsCatalogResponse'
                '400':
                    $ref: '#/components/responses/BadRequest'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '429':
                    $ref: '#/components/responses/TooManyRequests'
                '500':
                    $ref: '#/components/responses/InternalError'

