name: Tonkeeper Web Deploy
on:
    workflow_dispatch:
        inputs:
            environment:
                type: choice
                description: Deploy web to an environment or this branch's UI showcase
                required: true
                options:
                    - dev
                    - main
                    - showcase
            migration_old_origin:
                description: 'Origin the wallet is migrating away from'
                required: false
                type: string
                default: ''
            migration_new_origin:
                description: 'Origin this build is served from'
                required: false
                type: string
                default: ''

jobs:
    web-deploy:
        if: inputs.environment != 'showcase'
        uses: ./.github/workflows/web-build.yaml
        with:
            environment: ${{ inputs.environment }}
            migration_old_origin: ${{ inputs.migration_old_origin }}
            migration_new_origin: ${{ inputs.migration_new_origin }}
        secrets: inherit

    web-tests:
        needs: web-deploy
        uses: ./.github/workflows/web-tests.yaml
        with:
            base-url: ${{ needs.web-deploy.outputs.deployment-url }}
        secrets: inherit

    showcase-deploy:
        if: inputs.environment == 'showcase'
        uses: ./.github/workflows/showcase-deploy.yaml
        with:
            branch: ${{ github.ref_name }}-showcase
        secrets: inherit
