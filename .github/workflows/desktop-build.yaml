name: Tonkeeper Desktop Build
on:
    workflow_call:
        secrets:
            APPLE_API_KEY:
                required: true
            APPLE_API_KEY_ID:
                required: true
            APPLE_API_ISSUER:
                required: true
            IDENTITY_P12_B64:
                required: true
            IDENTITY_PASSPHRASE:
                required: true
    workflow_dispatch:

env:
    node-version: 22.22.2
    # @tonkeeper/chainkit installs from GitHub Packages; the public repo has no package access of its own.
    NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
    # The bundle outgrew Node's default 2 GB heap.
    NODE_OPTIONS: --max-old-space-size=6144

jobs:
    desktop-build:
        name: desktop-build
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      command: make:intel
                      tag: x64
                      dist: /apps/desktop/out/make
                    - os: ubuntu-latest
                      command: make:arm
                      tag: arm64
                      dist: /apps/desktop/out/make
                    - os: windows-latest
                      command: make:intel
                      tag: x64
                      dist: /apps/desktop/out/make/squirrel.windows/x64/*Setup.exe
                    - os: macos-15-intel
                      command: make:intel
                      tag: x64
                      dist: /apps/desktop/out/make
                    - os: macos-latest
                      command: make:arm
                      tag: arm
                      dist: /apps/desktop/out/make
                    - os: macos-latest
                      command: make:universal
                      tag: universal
                      dist: /apps/desktop/out/make

        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        env:
            APPLE_API_KEY: ${{ github.workspace }}/AuthKey.p8
            APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
            APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
            DEBUG: electron*
            LIBSECRET_PATH: /usr/lib/x86_64-linux-gnu/libsecret-1.so.0

        steps:
            - name: Checkout to git repository
              uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node-version }}

            - name: Enable Corepack
              run: |
                  corepack enable

            - name: Set up Linux AppImage packaging
              if: runner.os == 'Linux' && matrix.command == 'make:intel'
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes fakeroot libarchive-tools libfuse2 libsecret-1-0 libsecret-1-dev rpm zip

            - name: Decode service account into a file
              if: runner.os == 'macOS'
              env:
                  CREDENTIALS: ${{ secrets.APPLE_API_KEY }}
              run: |
                  echo $CREDENTIALS | base64 -d > ${{ github.workspace }}/AuthKey.p8

            - name: Configure keychain
              if: runner.os == 'macOS'
              uses: apple-actions/import-codesign-certs@v3
              with:
                  p12-file-base64: ${{ secrets.IDENTITY_P12_B64 }}
                  p12-password: ${{ secrets.IDENTITY_PASSPHRASE }}

            - name: Yarn cache
              uses: actions/cache@v4
              with:
                  path: ./.yarn/cache
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Run install
              uses: borales/actions-yarn@v5
              with:
                  cmd: install

            - name: Run build packages
              uses: borales/actions-yarn@v5
              with:
                  cmd: build:pkg

            - name: Run build intel distributive
              uses: borales/actions-yarn@v5
              env:
                  WALLETCONNECT_PROJECT_ID: ${{ vars.WALLETCONNECT_PROJECT_ID }}
              with:
                  cmd: ${{ matrix.command }}
                  dir: 'apps/desktop'

            - name: Upload zip distributives to artifacts
              uses: actions/upload-artifact@v4
              if: runner.os == 'Windows'
              with:
                  name: Tonkeeper Desktop ${{ runner.os }} x64 archive
                  retention-days: 10
                  path: |
                      ${{ github.workspace }}/apps/desktop/out/make/zip/**/*.zip

            - name: Upload distributives to artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: Tonkeeper Desktop ${{ runner.os }} ${{ matrix.tag }}
                  retention-days: 10
                  path: |
                      ${{ github.workspace }}${{ matrix.dist }}

            - name: Clean-up credentials
              if: always() && runner.os == 'macOS'
              run: |
                  rm ${{ github.workspace }}/AuthKey.p8
