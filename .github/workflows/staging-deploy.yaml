name: Staging Deploy

# Manual only: the private repo does not auto-deploy from main.
on:
    workflow_dispatch:

# Latest push wins; older in-flight deploys cancel.
concurrency:
    group: staging-deploy
    cancel-in-progress: true

jobs:
    web-build:
        uses: ./.github/workflows/web-build.yaml
        with:
            environment: staging
        secrets: inherit
