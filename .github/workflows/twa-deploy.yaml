name: Tonkeeper TWA Deploy

on:
    workflow_call:
        inputs:
            branch:
                description: 'Worker Preview name to deploy to'
                required: true
                type: string
        secrets:
            CLOUDFLARE_API_TOKEN:
                required: true
            CLOUDFLARE_ACCOUNT_ID:
                required: true
    workflow_dispatch:
        inputs:
            branch:
                description: 'Worker Preview name to deploy to'
                required: true
                type: string
                default: 'twa-recovery'

env:
    node-version: 22

jobs:
    twa-build:
        name: twa-build
        runs-on: ubuntu-latest
        timeout-minutes: 10

        outputs:
            deployment-url: ${{ steps.deploy.outputs.deployment-url }}
        steps:
            - name: Checkout to git repository
              uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.node-version }}

            - name: Enable Corepack
              run: |
                  corepack enable

            - name: Yarn cache
              uses: actions/cache@v4
              with:
                  path: ./.yarn
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Run install
              uses: borales/actions-yarn@v5
              with:
                  cmd: install

            - name: Run build
              uses: borales/actions-yarn@v5
              with:
                  cmd: build:twa

            - name: Test Worker deployment selection
              run: yarn test:workers

            - name: Select Worker deployment
              id: worker
              env:
                  WORKER_APP: twa
                  DEPLOYMENT_REF: ${{ inputs.branch }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
              run: node scripts/workers-deployment.mjs >> "$GITHUB_OUTPUT"

            - name: Publish to Cloudflare Workers
              id: deploy
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  wranglerVersion: "4.152.0"
                  command: ${{ steps.worker.outputs.command }}

            - name: Summary
              run: |
                  echo '### Successful TWA deployment 🚀🚀🚀' >> $GITHUB_STEP_SUMMARY
                  echo 'Well done!' >> $GITHUB_STEP_SUMMARY
                  echo 'Link to test environment:' >> $GITHUB_STEP_SUMMARY
                  echo '${{ steps.deploy.outputs.deployment-url }}' >> $GITHUB_STEP_SUMMARY

            - name: Comment PR
              uses: thollander/actions-comment-pull-request@v3
              if: github.event_name == 'pull_request'
              with:
                  message: |
                      ### Successful TWA deployment 🚀🚀🚀
                      Well done!
                      Link to test environment:
                      ${{ steps.deploy.outputs.deployment-url }}
                  comment-tag: twa_deploy
