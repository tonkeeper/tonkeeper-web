name: Cleanup Web Preview

on:
    pull_request:
        types: [closed]

jobs:
    cleanup:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Delete Worker Preview
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  wranglerVersion: '4.152.0'
                  command: preview delete --config apps/web/wrangler.jsonc --name pr-${{ github.event.pull_request.number }} --skip-confirmation
